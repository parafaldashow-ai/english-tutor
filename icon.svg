<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Fundo com bordas arredondadas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Livro aberto -->
  <g transform="translate(256, 320)">
    <!-- Página esquerda -->
    <path d="M -160,-60 Q -160,-80 -140,-80 L -20,-80 Q 0,-80 0,-60 L 0,100 Q 0,80 -20,80 L -140,80 Q -160,80 -160,60 Z"
          fill="url(#book)"/>
    <!-- Página direita -->
    <path d="M 160,-60 Q 160,-80 140,-80 L 20,-80 Q 0,-80 0,-60 L 0,100 Q 0,80 20,80 L 140,80 Q 160,80 160,60 Z"
          fill="url(#book)"/>
    <!-- Lombada central -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#c7d2fe" stroke-width="6"/>
    <!-- Linhas de texto (esquerda) -->
    <line x1="-130" y1="-40" x2="-20" y2="-40" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
    <line x1="-130" y1="-10" x2="-20" y2="-10" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
    <line x1="-130" y1="20" x2="-60" y2="20" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
    <!-- Linhas de texto (direita) -->
    <line x1="20" y1="-40" x2="130" y2="-40" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="-10" x2="130" y2="-10" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="130" y2="20" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Balão de fala -->
  <g transform="translate(340, 160)">
    <path d="M -80,-70 Q -80,-110 -40,-110 L 40,-110 Q 80,-110 80,-70 L 80,-20 Q 80,20 40,20 L 10,20 L -10,55 L -10,20 L -40,20 Q -80,20 -80,-20 Z"
          fill="#fbbf24" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round"/>
    <!-- Letras "EN" no balão -->
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="60" fill="#78350f">EN</text>
  </g>
</svg>